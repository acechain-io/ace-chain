[package]
name = "ace-vadar"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "VA-DAR: Vendor-Agnostic Deterministic Artifact Resolution for serverless wallet recovery"

[features]
persistence = ["ace-model/persistence", "bincode", "parking_lot", "tracing"]

[dependencies]
ace-runtime = { workspace = true }
ace-model = { workspace = true }

sha2 = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
bincode = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
ed25519-dalek = { workspace = true }
rand = { workspace = true }
