[package]
name = "ace-consensus"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "BFT consensus, leader rotation, and block production for ACE Chain"

[features]
default = ["test-utils"]
test-utils = ["ace-runtime/test-utils", "ace-model/test-utils", "ace-engine/test-utils"]

[dependencies]
ace-runtime = { workspace = true }
ace-model = { workspace = true }
ace-engine = { workspace = true }
ace-n-vm = { workspace = true, default-features = false }
ace-mempool = { workspace = true }
mev-ace-core = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
