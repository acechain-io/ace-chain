[package]
name = "ace-n-vm"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ACE Chain Tri-VM dispatcher — routes transactions to EVM, SVM, or ACE Native execution engines"

[features]
default = []
# When disabled (e.g. production build), ACE precompiles/syscalls return Err so contracts revert.
mock-precompile = []

[dependencies]
ace-runtime = { workspace = true }
ace-model = { workspace = true }
ace-engine = { workspace = true }
ace-mvm = { workspace = true, default-features = false }
sha2 = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
revm = { workspace = true }
rayon = { workspace = true }
rlp = "0.5"
tiny-keccak = "2"
k256 = { version = "0.13", features = ["ecdsa", "schnorr"] }
ripemd = "0.1"
bitcoin = "0.32"
# Solana Ed25519 signature verification
ed25519-dalek = { workspace = true }
bs58 = "0.5"
parking_lot = { workspace = true }
