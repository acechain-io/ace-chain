[package]
name = "ace-defi-relayer"
version = "0.1.0"
edition = "2021"

[dependencies]
# ACE internal
ace-defi = { path = "../ace-defi" }
ace-model = { path = "../ace-model" }

# RPC and blockchain clients
ethers = { version = "2.0", optional = true }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# Cryptography
ed25519-dalek = "2.0"
k256 = { version = "0.13", features = ["ecdsa"] }
rlp = "0.5"
sha2 = "0.10"
tiny-keccak = { version = "2", features = ["keccak"] }
rand = "0.8"

# Logging and error handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"

# HTTP for mock oracle
reqwest = { version = "0.11", features = ["json"] }

# Time handling
chrono = "0.4"

[dev-dependencies]
tokio-test = "0.4"
